name: Node.js build

on:
    pull_request:
        branches: ["**"]
    workflow_dispatch:
    workflow_call: 

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm run lint
